<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ready? — Brutal Quotes</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#240b0b;--bg2:#12040a;--amber:#ffb21a;--hot:#ff6a00;--dim:#7a3a1a;--qc:#ffb21a;--qg:#ffb21a;--on:#2a0c05;--sheet:#1a0707;--grid:rgba(255,90,40,.07);--glow:rgba(255,106,0,.35)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 45%,var(--bg) 0,var(--bg2) 75%);color:var(--amber);font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 6px),
repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 6px)}
header{padding:16px 14px 0;text-align:center;font-size:10px;color:var(--dim);letter-spacing:1px;position:relative;z-index:1}

/* side-scroll menu */
.menu{display:flex;align-items:center;position:relative;z-index:1;padding:14px 12px 14px 0}
.tabs{flex:1;min-width:0;display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding:0 18px 0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.pin{flex:0 0 auto;display:flex;gap:8px;padding-left:10px;border-left:2px solid var(--dim)}
.tabs button,.pin button{flex:0 0 auto;font:inherit;font-size:9px;color:var(--amber);background:transparent;border:2px solid var(--dim);padding:9px 10px;cursor:pointer;text-transform:uppercase;white-space:nowrap;scroll-snap-align:center;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:40px;min-height:38px}
.tabs button.on{background:var(--amber);color:var(--on);border-color:var(--amber);box-shadow:0 0 14px var(--hot)}
.pin button{border-color:var(--amber);box-shadow:0 0 10px var(--glow)}
.pin button.plus{font-size:16px;background:var(--amber);color:var(--on);padding:6px 12px}
.dot{width:11px;height:11px;border:2px solid var(--on);background:var(--qc);display:inline-block;outline:1px solid var(--amber)}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;cursor:pointer;position:relative;z-index:1}
#q{max-width:760px;color:var(--qc);font-size:clamp(14px,4.6vw,28px);line-height:1.9;text-transform:uppercase;text-shadow:0 0 6px var(--qg),0 0 18px var(--qg);word-break:break-word}
#q::after{content:"";display:inline-block;width:.8em;height:1em;margin-left:.35em;vertical-align:-.1em;background:
repeating-linear-gradient(0deg,var(--on) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,var(--on) 0 1px,transparent 1px 4px),var(--qc);box-shadow:0 0 12px var(--qg);animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
footer{padding:12px 14px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;position:relative;z-index:1}
.fbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big{font:inherit;font-size:12px;background:var(--amber);color:var(--on);border:0;padding:16px 22px;cursor:pointer;box-shadow:0 0 18px var(--hot);text-transform:uppercase}
.big.alt{background:transparent;color:var(--amber);border:2px solid var(--amber);box-shadow:none}
.big:active{transform:translateY(2px)}
small{display:block;margin-top:12px;font-size:8px;color:var(--dim);line-height:1.8}

/* sheets */
#back{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;display:flex;flex-direction:column;background:var(--sheet);border-top:3px solid var(--amber);box-shadow:0 -10px 40px var(--glow);z-index:21;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:14px;font-size:10px;border-bottom:2px solid var(--dim)}
.x{font:inherit;font-size:11px;background:transparent;color:var(--amber);border:2px solid var(--dim);padding:8px 10px;cursor:pointer}
.sh-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.lbl{font-size:8px;color:var(--dim);letter-spacing:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sh-body button.b{font:inherit;font-size:9px;color:var(--amber);background:transparent;border:2px solid var(--amber);padding:11px 11px;cursor:pointer;text-transform:uppercase}
.sh-body button.b.fill{background:var(--amber);color:var(--on)}
.sh-body button.b:active{transform:translateY(2px)}
input,textarea{user-select:text;-webkit-user-select:text;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;color:var(--amber);background:var(--bg2);border:2px solid var(--dim);padding:10px;border-radius:0;outline:0}
input:focus,textarea:focus{border-color:var(--amber)}
#hex{flex:1;min-width:150px}
#fname{flex:1;min-width:140px}
#native{width:46px;height:42px;padding:2px;cursor:pointer}
#prev{font-size:clamp(11px,3.6vw,16px);text-transform:uppercase;color:var(--qc);text-shadow:0 0 6px var(--qg),0 0 14px var(--qg);padding:14px;border:2px dashed var(--dim);text-align:center;line-height:1.8}
.wheelwrap{position:relative;width:min(240px,68vw);aspect-ratio:1;margin:0 auto}
#wheel{width:100%;height:100%;border-radius:50%;touch-action:none;cursor:crosshair;display:block;box-shadow:0 0 18px var(--glow)}
#mark{position:absolute;width:20px;height:20px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000,0 0 8px #000;transform:translate(-50%,-50%);pointer-events:none}
input[type=range]{width:100%;padding:0;height:34px;background:transparent;border:0;accent-color:var(--amber)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button,.mc>button{width:34px;height:34px;border:2px solid var(--dim);cursor:pointer;padding:0}
.sw button:active,.mc>button:active{border-color:#fff}
.mc{position:relative}
.mc>b{position:absolute;top:-8px;right:-8px;width:18px;height:18px;background:#000;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;border:1px solid var(--dim);cursor:pointer}
.none{font-size:8px;color:var(--dim)}
#code{width:100%;height:170px;resize:vertical;white-space:pre;overflow:auto;font-size:13px;line-height:1.4}
.item{display:flex;gap:8px;align-items:center;justify-content:space-between;border:2px solid var(--dim);padding:8px;flex-wrap:wrap}
.item span{font-size:9px;line-height:1.6;word-break:break-all;flex:1 1 120px}
.item .row button{padding:8px 8px!important;font-size:8px!important}

/* right drawer */
#edge{position:fixed;top:0;bottom:0;right:0;width:20px;z-index:15;touch-action:pan-y}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(78vw,320px);background:var(--sheet);border-left:3px solid var(--amber);box-shadow:-10px 0 40px var(--glow);z-index:30;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));touch-action:pan-y}
#drawer.open{transform:none}
#drawer h3{font-size:10px;margin:0 0 4px;color:var(--dim);letter-spacing:1px}
#drawer button{font:inherit;font-size:10px;text-align:left;color:var(--amber);background:transparent;border:2px solid var(--amber);padding:15px 14px;cursor:pointer;text-transform:uppercase;line-height:1.6}
#drawer button.fill{background:var(--amber);color:var(--on)}
#drawer button:active{transform:translateY(2px)}

/* reader */
#reader{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#reader .bar{display:flex;gap:8px;align-items:center;padding:10px;background:var(--sheet);border-bottom:3px solid var(--amber)}
#reader .bar span{flex:1;font-size:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reader iframe{flex:1;border:0;background:#fff;width:100%}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--amber);color:var(--on);font-size:9px;padding:10px 14px;z-index:60;box-shadow:0 0 16px var(--hot);text-transform:uppercase;max-width:92vw;text-align:center;line-height:1.6}
</style>
</head>
<body>
<header id="count">READY?</header>
<div class="menu">
  <nav class="tabs" id="tabs" aria-label="Categories"></nav>
  <div class="pin">
    <button id="colorTab" aria-label="Quote color"><i class="dot"></i></button>
    <button id="htmlTab" class="plus" aria-label="Paste HTML">+</button>
  </div>
</div>
<main id="stage"><div id="q"></div></main>
<footer>
  <small>TAP ANYWHERE FOR A NEW QUOTE · AUTO SHUFFLE EVERY 5 SEC</small>
</footer>

<div id="back" hidden></div>

<!-- COLOR SHEET -->
<section class="sheet" id="colorSheet" hidden>
  <div class="sh-head"><span>QUOTE COLOR</span><button class="x" data-close>X</button></div>
  <div class="sh-body">
    <div id="prev">THIS IS HOW YOUR QUOTE LOOKS</div>
    <div class="wheelwrap"><canvas id="wheel" width="260" height="260"></canvas><i id="mark"></i></div>
    <div>
      <div class="lbl">BRIGHTNESS</div>
      <input type="range" id="val" min="0" max="100" value="100">
    </div>
    <div>
      <div class="lbl" style="margin-bottom:8px">COLOR CODE (HEX, RGB, OR NAME)</div>
      <div class="row">
        <input id="hex" maxlength="40" placeholder="#FFB21A" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="b fill" id="apply">Set</button>
      </div>
    </div>
    <div class="row">
      <input type="color" id="native" aria-label="System color picker">
      <button class="b" id="saveCol">Save color</button>
      <button class="b" id="resetCol">Reset</button>
    </div>
    <div class="lbl">PRESETS</div>
    <div class="sw" id="presets"></div>
    <div class="lbl">MY COLORS</div>
    <div class="sw" id="mine"></div>
  </div>
</section>

<!-- HTML SHEET -->
<section class="sheet" id="htmlSheet" hidden>
  <div class="sh-head"><span>PASTE HTML</span><button class="x" data-close>X</button></div>
  <div class="sh-body">
    <textarea id="code" placeholder="Paste any HTML code here..." spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <div class="row">
      <button class="b" id="pasteBtn">Paste</button>
      <button class="b" id="clearBtn">Clear</button>
    </div>
    <input id="fname" placeholder="file name (optional)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <button class="b fill" id="readBtn">Read</button>
      <button class="b fill" id="saveBtn">Save .html</button>
      <button class="b" id="libBtn">+ Library</button>
    </div>
    <div class="lbl">LIBRARY (SAVED IN THIS BROWSER)</div>
    <div id="lib" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
</section>

<!-- READER -->
<div id="reader" hidden>
  <div class="bar">
    <button class="x" id="rBack">BACK</button>
    <span id="rName"></span>
    <button class="x" id="rSave">SAVE</button>
  </div>
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-popups allow-modals" title="HTML reader"></iframe>
</div>

<input type="file" id="fileIn" accept=".html,.htm,text/html" multiple hidden>
<div id="edge"></div>
<aside id="drawer" aria-label="Menu">
  <h3>MENU</h3>
  <button class="fill" id="dFile">+ Open HTML file</button>
  <button id="dPaste">Paste HTML</button>
  <button id="dColor">Quote color</button>
  <small>SWIPE RIGHT TO CLOSE</small>
</aside>

<div id="toast" hidden></div>

<script>
/* ---------- QUOTES ---------- */
const D={
start:{a:["Stop planning. Start moving.","Nobody is coming to push you. Start.","Open the laptop. Do the first ten minutes.","You don’t need motivation. You need a start.","Your mood doesn’t get a vote. Begin.","The couch built nothing. Get up.","Start ugly. Fix it later.","Waiting for the perfect time is lazy fear.","Do it now. Feel ready never.","Five minutes. Just start. Go.","Tomorrow is where dreams go to die. Start today.","Discipline is doing it when you hate it.","Your excuses are comfortable. Your life won’t be.","Action kills fear. Move.","Quit negotiating with yourself. Get up.","The hardest part is the first rep. Do it.","Be tired and work anyway.","No one cares how you feel. Work."],
b:["Now.","No excuses.","Clock is ticking.","Go.","Do it scared.","Don’t think. Move.","Prove yourself right.","Then do it again.","Today counts.","Be dangerous.","Make it hurt less later.","Start the timer."]},
focus:{a:["Phone down. Eyes up.","Distraction is a slow way to fail.","Close every tab. One task only.","Focus is a weapon. Most people sold theirs.","Your feed is making someone else rich.","Deep work or deep regret. Choose.","Silence the noise. Hear the work.","Scrolling is not resting. It’s stealing.","One thing. Fully. Until it’s done.","Be unreachable. Be unstoppable.","You can’t build with a split brain.","Attention is your only real currency.","Mediocre people multitask. Winners lock in.","Turn off notifications. Turn on ambition.","The world can wait ninety minutes.","Stay with the boring part. That’s where it’s won.","Lock in or lose out.","Your phone is not your friend right now."],
b:["Lock in.","No switching.","Stay here.","Ninety minutes. Zero excuses.","Eyes on the work.","Finish what you opened.","Burn the distractions.","Don’t blink.","Earn your rest.","Stay.","Be ruthless about it.","One more hour."]},
study:{a:["Study now. Celebrate never early.","Your future self is watching you waste time.","Read the page. Not the screen.","Everyone wants results. Few want revision.","Books don’t read themselves.","Hard now. Easy later. Pick one.","Exams don’t care about your feelings.","Learn it until you can’t get it wrong.","Sleepy? Splash water. Open the book.","Marks aren’t luck. They’re hours.","Someone is studying right now. Beat them.","Ignorance is expensive. Study.","Repeat it till it’s boring. Then repeat again.","Don’t memorize. Understand. Then dominate.","Your rank is built tonight.","Comfort never topped a class.","Pain of study or pain of regret.","Revise. Test. Fix. Repeat."],
b:["No shortcuts.","Pages don’t turn themselves.","Do the hard chapter first.","Sleep after you’ve earned it.","Grind quietly.","Make them say how.","Outwork the smart ones.","Every hour counts.","Be the topper.","Finish the syllabus.","Silence. Pen. Paper.","Again."]},
money:{a:["Broke is a choice you keep renewing.","Money follows skill. Build skill.","Nobody pays for your potential.","Stop wishing. Start earning.","Rich people trade time for leverage. Learn how.","Comfort is expensive. Poverty is more.","Your salary won’t save you. Your skills might.","Spend less than you earn. Boring. Works.","Don’t flex. Invest.","Be so good they pay without arguing.","Hustle now. Choose later.","Your bank balance is a report card.","Sell value. Not hours.","Cheap habits, expensive dreams. Pick.","Fear of risk keeps you poor.","Make money while they make excuses.","Work until your signature looks like a brand.","Earn it. Stack it. Protect it."],
b:["Get paid.","Stay hungry.","Build the asset.","Respect money. It respects back.","Be useful. Be rich.","Cash is proof.","Level up your price.","Stack daily.","No handouts coming.","Think long. Work now.","Wealth is quiet.","Go get it."]},
goal:{a:["A goal without a deadline is a daydream.","Write the goal. Then bleed for it.","You’re not behind. You’re not moving.","Dream big. Execute bigger.","Average is a crowded place. Leave.","Your goal doesn’t care about your mood.","Winners were once beginners who didn’t quit.","Pain is temporary. Regret is forever.","Want it more than you want sleep.","No plan B. Plan harder.","Be obsessed or be average.","Break the goal. Beat the day.","Prove them wrong with results.","Small steps still beat standing still.","You owe your dream your best effort.","Quit complaining. Keep climbing.","The goal is the boss. Report to it.","Become the person your goal requires."],
b:["No days off.","Every day. No excuses.","Finish it.","Don’t stop.","Win quietly.","Obsess.","Make it inevitable.","Rise and grind.","Outlast everyone.","Get back up.","Reach it.","Burn the boats."]},
grind:{a:["Discipline beats talent when talent sleeps.","Do the work. Skip the speech.","Be consistent. Brilliance is overrated.","Your habits are voting for your future.","Hard days build hard people.","Raise your standard. Then meet it.","Nobody remembers who rested. They remember who won.","Stay late. Start early. Say nothing.","Motivation fades. Systems stay.","Show up on the days you don’t want to.","Small wins daily. Empire later.","Be the one who doesn’t quit."],
b:["Repeat.","Again tomorrow.","Stay humble. Stay hungry.","No audience needed.","Earn it.","Keep going.","Harder.","Own the day."]}
};
const names={all:"All",start:"Start",focus:"Focus",study:"Study",money:"Money",goal:"Goal",grind:"Grind"};

/* ---------- HELPERS ---------- */
const $=id=>document.getElementById(id);
const root=document.documentElement;
const ls={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* ---------- QUOTE ENGINE ---------- */
const pool={};let all=[];
for(const k in D){pool[k]=[];for(const a of D[k].a)for(const b of D[k].b)pool[k].push(a+" "+b);all=all.concat(pool[k])}
pool.all=all;
$('count').textContent="READY? "+all.length+" QUOTES LOADED";
let cat="all",last=-1,timer,auto,curText="",openEl=null,drawerOpen=false;
const q=$('q'),tabs=$('tabs');

function startAuto(){clearInterval(auto);if(!openEl&&!drawerOpen&&$('reader').hidden)auto=setInterval(show,5000)}
function show(){
  startAuto();
  const p=pool[cat];let i;
  do{i=Math.floor(Math.random()*p.length)}while(i===last&&p.length>1);
  last=i;curText=p[i];
  clearInterval(timer);q.textContent="";let n=0;
  timer=setInterval(()=>{n+=2;q.textContent=curText.slice(0,n);if(n>=curText.length)clearInterval(timer)},22);
}

/* ---------- MENU (side scroll) ---------- */
const catBtns={};
for(const k in names){
  const b=document.createElement('button');b.textContent=names[k];if(k==="all")b.className="on";
  b.onclick=e=>{e.stopPropagation();cat=k;for(const x in catBtns)catBtns[x].classList.remove('on');b.classList.add('on');b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});show()};
  catBtns[k]=b;tabs.appendChild(b);
}
$('colorTab').onclick=e=>{e.stopPropagation();openSheet($('colorSheet'))};
$('htmlTab').onclick=e=>{e.stopPropagation();openDrawer()};

/* ---------- SHEETS ---------- */
function openSheet(el){closeSheet(true);openEl=el;el.hidden=false;$('back').hidden=false;clearInterval(auto)}
function closeSheet(quiet){
  if(!openEl)return;
  openEl.hidden=true;$('back').hidden=true;openEl=null;
  if(!quiet)startAuto();
}
$('back').onclick=()=>{closeDrawer();closeSheet()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet());

/* ---------- COLOR ENGINE ---------- */
function hsv2rgb(h,s,v){
  const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function rgb2hsv(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}
  if(h<0)h+=360;
  return [h,mx?d/mx:0,mx];
}
const toHex=rgb=>'#'+rgb.map(n=>Math.max(0,Math.min(255,n)).toString(16).padStart(2,'0')).join('').toUpperCase();

const probe=document.createElement('canvas').getContext('2d');
function parseColor(str){
  let s=String(str).trim();if(!s)return null;
  let m=s.match(/^#?([0-9a-f]{3})$/i);
  if(m){const h=m[1];return [parseInt(h[0]+h[0],16),parseInt(h[1]+h[1],16),parseInt(h[2]+h[2],16)]}
  m=s.match(/^#?([0-9a-f]{6})$/i);
  if(m){const h=m[1];return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
  probe.fillStyle='#010203';probe.fillStyle=s;
  const v=probe.fillStyle;
  if(v==='#010203'&&s.toLowerCase()!=='#010203')return null;
  if(v[0]==='#')return [parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)];
  const n=v.match(/[\d.]+/g);
  return n&&n.length>=3?[Math.round(+n[0]),Math.round(+n[1]),Math.round(+n[2])]:null;
}

const wheel=$('wheel'),wc=wheel.getContext('2d'),mark=$('mark'),hexIn=$('hex'),nat=$('native'),valIn=$('val');
let H=38,S=.9,V=1,cur='#FFB21A',drag=false;

function drawWheel(){
  const W=wheel.width,r=W/2,img=wc.createImageData(W,W),d=img.data;
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){
    const dx=x-r+.5,dy=y-r+.5,dist=Math.hypot(dx,dy),i=(y*W+x)*4;
    if(dist<=r){
      const h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
      const c=hsv2rgb(h,Math.min(1,dist/r),V);
      d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
    }
  }
  wc.putImageData(img,0,0);
}
function place(){
  const a=H*Math.PI/180;
  mark.style.left=(50+50*S*Math.cos(a))+'%';
  mark.style.top=(50+50*S*Math.sin(a))+'%';
}
function setTheme(rgb,hex){
  const [h,s]=rgb2hsv(rgb[0],rgb[1],rgb[2]);
  const lum=(.299*rgb[0]+.587*rgb[1]+.114*rgb[2])/255;
  /* UI accent: your exact color, lightened only if it would vanish on a dark UI */
  let ui=rgb;
  if(lum<.28){const t=(.28-lum)/.28*.6+.25;ui=rgb.map(c=>Math.round(c+(255-c)*t))}
  const uiHex=toHex(ui),ul=(.299*ui[0]+.587*ui[1]+.114*ui[2])/255;
  const tint=Math.min(.85,s*.8+.1);
  const bg=toHex(hsv2rgb(h,tint,.15)),bg2=toHex(hsv2rgb(h,tint,.065)),sheet=toHex(hsv2rgb(h,tint,.1));
  const dim=toHex(ui.map(c=>Math.round(c*.45)));
  const st=root.style;
  st.setProperty('--amber',uiHex);st.setProperty('--hot',uiHex);st.setProperty('--dim',dim);
  st.setProperty('--bg',bg);st.setProperty('--bg2',bg2);st.setProperty('--sheet',sheet);
  st.setProperty('--on',ul>.55?'#12040a':'#ffffff');
  st.setProperty('--grid','rgba('+ui.join(',')+',.07)');
  st.setProperty('--glow','rgba('+ui.join(',')+',.35)');
}
function applyColor(hex){
  cur=hex;
  setTheme(parseColor(hex),hex);
  root.style.setProperty('--qc',hex);
  root.style.setProperty('--qg',hex);
  hexIn.value=hex;nat.value=hex.toLowerCase();
  ls.set('rq_color',hex);
}
function commit(){applyColor(toHex(hsv2rgb(H,S,V)));place()}
function fromInput(str){
  const rgb=parseColor(str);
  if(!rgb){toast('Bad color code');return false}
  [H,S,V]=rgb2hsv(rgb[0],rgb[1],rgb[2]);
  valIn.value=Math.round(V*100);
  drawWheel();applyColor(toHex(rgb));place();
  return true;
}
function pick(e){
  const r=wheel.getBoundingClientRect(),rad=r.width/2;
  let dx=e.clientX-(r.left+rad),dy=e.clientY-(r.top+rad),d=Math.hypot(dx,dy);
  if(d>rad){d=rad}
  H=(Math.atan2(dy,dx)*180/Math.PI+360)%360;S=d/rad;commit();
}
wheel.addEventListener('pointerdown',e=>{drag=true;wheel.setPointerCapture(e.pointerId);pick(e)});
wheel.addEventListener('pointermove',e=>{if(drag)pick(e)});
['pointerup','pointercancel'].forEach(ev=>wheel.addEventListener(ev,()=>drag=false));
valIn.addEventListener('input',()=>{V=valIn.value/100;drawWheel();commit()});
$('apply').onclick=()=>fromInput(hexIn.value);
hexIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();fromInput(hexIn.value)}});
hexIn.addEventListener('input',()=>{const rgb=parseColor(hexIn.value);if(rgb&&/^#?[0-9a-f]{6}$/i.test(hexIn.value.trim()))fromInput(hexIn.value)});
nat.addEventListener('input',()=>fromInput(nat.value));
$('resetCol').onclick=()=>fromInput('#FFB21A');

const PRESETS=['#FFB21A','#FF6A00','#FF2D2D','#FF2D95','#B84DFF','#4D7CFF','#18D6FF','#19FFB0','#7CFF3A','#FFE94D','#FFFFFF','#C0C0C0'];
PRESETS.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>fromInput(c);$('presets').appendChild(b)});

let mine=ls.get('rq_saved',[]);
function renderMine(){
  const box=$('mine');box.textContent='';
  if(!mine.length){const n=document.createElement('span');n.className='none';n.textContent='NONE YET. PICK A COLOR, TAP SAVE COLOR.';box.appendChild(n);return}
  mine.forEach((c,i)=>{
    const w=document.createElement('div');w.className='mc';
    const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>fromInput(c);
    const x=document.createElement('b');x.textContent='×';x.onclick=e=>{e.stopPropagation();mine.splice(i,1);ls.set('rq_saved',mine);renderMine()};
    w.appendChild(b);w.appendChild(x);box.appendChild(w);
  });
}
$('saveCol').onclick=()=>{
  if(mine.includes(cur)){toast('Already saved');return}
  mine.unshift(cur);mine=mine.slice(0,16);ls.set('rq_saved',mine);renderMine();toast('Saved '+cur);
};

/* init color */
fromInput(ls.get('rq_color','#FFB21A'))||fromInput('#FFB21A');
renderMine();

/* ---------- HTML PASTE / SAVE / READ ---------- */
const code=$('code'),fname=$('fname');
function guessName(html){
  let base='';
  const m=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  if(m)base=m[1].trim();
  base=base.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60);
  if(!base){const d=new Date(),p=n=>String(n).padStart(2,'0');base='page-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())}
  return base;
}
function finalName(html){
  let n=fname.value.trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'-');
  if(!n)n=guessName(html);
  return /\.html?$/i.test(n)?n:n+'.html';
}
function download(name,html){
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);
  toast('Saved '+name);
}
function needCode(){const h=code.value;if(!h.trim()){toast('Paste some HTML first');return null}return h}
$('pasteBtn').onclick=async()=>{
  try{const t=await navigator.clipboard.readText();if(!t){toast('Clipboard empty');return}code.value=t;toast('Pasted')}
  catch(e){toast('Long-press the box and tap Paste');code.focus()}
};
$('clearBtn').onclick=()=>{code.value='';fname.value='';code.focus()};
$('saveBtn').onclick=()=>{const h=needCode();if(h)download(finalName(h),h)};
$('readBtn').onclick=()=>{const h=needCode();if(h)openReader(h,finalName(h))};

let lib=ls.get('rq_lib',[]);
function renderLib(){
  const box=$('lib');box.textContent='';
  if(!lib.length){const n=document.createElement('span');n.className='none';n.textContent='EMPTY';box.appendChild(n);return}
  lib.forEach((it,i)=>{
    const row=document.createElement('div');row.className='item';
    const s=document.createElement('span');s.textContent=it.name;
    const btns=document.createElement('div');btns.className='row';
    const mk=(t,fn)=>{const b=document.createElement('button');b.className='b';b.textContent=t;b.onclick=fn;btns.appendChild(b)};
    mk('Read',()=>openReader(it.html,it.name));
    mk('Save',()=>download(it.name,it.html));
    mk('Del',()=>{lib.splice(i,1);ls.set('rq_lib',lib);renderLib()});
    row.appendChild(s);row.appendChild(btns);box.appendChild(row);
  });
}
$('libBtn').onclick=()=>{
  const h=needCode();if(!h)return;
  lib.unshift({name:finalName(h),html:h,ts:Date.now()});
  if(!ls.set('rq_lib',lib)){lib.shift();toast('Storage full. Use Save .html');return}
  renderLib();toast('Added to library');
};
renderLib();

let rCur={name:'',html:''};
function openReader(html,name){
  rCur={name,html};
  $('rName').textContent=name;
  $('frame').srcdoc=html;
  clearInterval(auto);
  $('reader').hidden=false;
}
$('rBack').onclick=()=>{$('reader').hidden=true;$('frame').srcdoc='';startAuto()};
$('rSave').onclick=()=>download(rCur.name,rCur.html);

/* ---------- RIGHT DRAWER (swipe from right edge, or tap +) ---------- */
const drawer=$('drawer');
function openDrawer(){
  closeSheet(true);
  drawer.classList.add('open');$('back').hidden=false;drawerOpen=true;clearInterval(auto);
}
function closeDrawer(quiet){
  if(!drawerOpen)return;
  drawer.classList.remove('open');drawerOpen=false;
  if(!openEl)$('back').hidden=true;
  if(!quiet)startAuto();
}
let sx=null,sy=null;
function swipeStart(e){const t=e.touches[0];sx=t.clientX;sy=t.clientY}
function swipeOpen(e){
  if(sx===null)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(dx<-28&&Math.abs(dx)>Math.abs(dy)){sx=null;openDrawer()}
}
function swipeClose(e){
  if(sx===null)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(dx>40&&Math.abs(dx)>Math.abs(dy)){sx=null;closeDrawer()}
}
const edge=$('edge');
edge.addEventListener('touchstart',swipeStart,{passive:true});
edge.addEventListener('touchmove',swipeOpen,{passive:true});
drawer.addEventListener('touchstart',swipeStart,{passive:true});
drawer.addEventListener('touchmove',swipeClose,{passive:true});
['touchend','touchcancel'].forEach(ev=>{edge.addEventListener(ev,()=>sx=null);drawer.addEventListener(ev,()=>sx=null)});

$('dFile').onclick=()=>$('fileIn').click();
$('dPaste').onclick=()=>{closeDrawer(true);openSheet($('htmlSheet'))};
$('dColor').onclick=()=>{closeDrawer(true);openSheet($('colorSheet'))};

/* open HTML files from the phone's file manager */
$('fileIn').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length)return;
  let first=null;
  for(const f of files){
    try{
      const html=await f.text();
      const name=/\.html?$/i.test(f.name)?f.name:f.name+'.html';
      if(!first)first={name,html};
      lib=lib.filter(x=>x.name!==name);
      lib.unshift({name,html,ts:Date.now()});
    }catch(err){toast('Could not read '+f.name)}
  }
  if(!ls.set('rq_lib',lib))toast('File too big to keep in library');
  renderLib();
  closeDrawer(true);
  if(first){
    if(files.length>1)toast(files.length+' files added to library');
    openReader(first.html,first.name);
  }
});

/* ---------- FOOTER + INPUT ---------- */
$('stage').onclick=show;
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('reader').hidden)$('rBack').click();else{closeDrawer();closeSheet()}return}
  const t=e.target.tagName;
  if(openEl||drawerOpen||t==='INPUT'||t==='TEXTAREA'||t==='BUTTON')return;
  if(e.code==="Space"||e.code==="Enter"){e.preventDefault();show()}
});
show();
</script>
</body>
</html>
